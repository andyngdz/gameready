name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p gameready-cli -p gameready-tray

      - name: Package
        run: |
          for binary in gameready gameready-tray; do
            asset="$binary-linux-x86_64"
            cp "target/x86_64-unknown-linux-musl/release/$binary" "$asset"
            chmod +x "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
          # The desktop entry and its icon ship alongside, so a script install
          # can put the tray on the bar the way the packages do.
          cp pkg/gameready-tray.desktop .
          cp crates/gameready-tray/assets/gameready.svg .
          sha256sum gameready-tray.desktop > gameready-tray.desktop.sha256
          sha256sum gameready.svg > gameready.svg.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            gameready-linux-x86_64 \
            gameready-linux-x86_64.sha256 \
            gameready-tray-linux-x86_64 \
            gameready-tray-linux-x86_64.sha256 \
            gameready-tray.desktop \
            gameready-tray.desktop.sha256 \
            gameready.svg \
            gameready.svg.sha256
