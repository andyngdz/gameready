[workspace]
members = ["crates/gameready-core", "crates/gameready-cli", "crates/gameready-tray"]
resolver = "3"

[workspace.package]
version = "0.2.7"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/andyngdz/gameready"
description = "Reversible Linux gaming optimizer with per-step verification and rollback"

[workspace.dependencies]
gameready-core = { path = "crates/gameready-core" }

anyhow = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive", "env", "wrap_help"] }
console = "0.16.4"
directories = "6.0.0"
indicatif = "0.18.6"
itertools = "0.14"
keyvalues-parser = "0.2.4"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
resvg = { version = "0.48.1", default-features = false }
zbus = { version = "5.18.0", default-features = false, features = ["async-io", "blocking-api"] }
inquire = "0.9.4"
steamlocate = "2.1.0"
steam-vdf-parser = "0.1.2"
rust-embed = { version = "8.12.0", features = ["debug-embed", "include-exclude", "interpolate-folder-path"] }
rustix = { version = "1.1.4", features = ["process", "fs"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
terminal_size = "0.4.4"
ureq = "3.3"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "3.0.0"

assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "filters"] }
insta-cmd = "0.7.0"
predicates = "3.1.4"
proptest = "1.11.0"
rstest = "0.26.1"
tempfile = "3.27.0"

[workspace.lints.clippy]
# The load-bearing safety invariant: a step must never mutate system state
# without an undo record already fsync'd. Steps go through ApplyCx::mutate,
# which journals first. Calling the runner directly from a step bypasses that.
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
