# Verified against this machine's Steam library on 2026-08-05.
name = "Deadlock"
steam_appid = 1422450

[launch]
gamemode = true

# No DXVK_ASYNC here. The dxvk-async patch it belongs to was dropped from
# GE-Proton in 7-45, because DXVK 2.0 does the same job through
# VK_EXT_graphics_pipeline_library with none of the drawbacks. On a build that
# still carries the patch it draws through walls while shaders compile, which
# reads as a wallhack to anticheat. Deadlock is exactly the wrong game for that.

[proton]
prefer = "GE-Proton"
